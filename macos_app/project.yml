name: BCINavigator
options:
  bundleIdPrefix: edu.cornell.cuxr
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  BCINavigator:
    type: application
    platform: macOS
    sources:
      - BCINavigator
    info:
      path: BCINavigator/Info.plist
      properties:
        CFBundleDisplayName: BCI Navigator
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.medical
        NSBluetoothAlwaysUsageDescription: BCI Navigator connects to your Muse 2 headband to check that each sensor touches your skin.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.cornell.cuxr.BCINavigator
        PRODUCT_NAME: BCI Navigator
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
